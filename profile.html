<!DOCTYPE html>
<html>
<head><title>My Profile</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="container mt-5">
  <h2>My Profile</h2>
  <div id="profileInfo"></div>
  <h3 class="mt-4">My Bookings</h3>
  <div id="bookingsList"></div>
  <button id="logoutBtn" class="btn btn-danger mt-3">Logout</button>
</div>
<script src="./config.js"></script>
<script>
  const API_BASE = window._APP_CONFIG_.API_BASE_URL;
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/login.html';

  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/auth/profile`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      const user = await res.json();
      document.getElementById('profileInfo').innerHTML = `
        <div class="card"><div class="card-body">
          <h5>${user.full_name || user.email}</h5>
          <p>Email: ${user.email}</p>
          <p>Role: ${user.role}</p>
        </div></div>
      `;
    } catch (err) {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }
  }

  async function loadBookings() {
    try {
      const res = await fetch(`${API_BASE}/bookings`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error();
      const bookings = await res.json();
      if (bookings.length === 0) {
        document.getElementById('bookingsList').innerHTML = '<p>No bookings yet.</p>';
        return;
      }
      let html = '<table class="table table-striped"><thead><tr><th>Room</th><th>Check In</th><th>Check Out</th><th>Total Price</th><th>Status</th></tr></thead><tbody>';
      bookings.forEach(b => {
        html += `<tr>
          <td>${b.room_number} (${b.room_type})</td>
          <td>${new Date(b.check_in).toLocaleDateString()}</td>
          <td>${new Date(b.check_out).toLocaleDateString()}</td>
          <td>$${b.total_price}</td>
          <td>${b.status}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('bookingsList').innerHTML = html;
    } catch (err) {
      document.getElementById('bookingsList').innerHTML = '<div class="alert alert-warning">Could not load bookings.</div>';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('token');
    if (window.magicchat_io?.logout) window.magicchat_io.logout();
    window.location.href = '/';
  });

  loadProfile();
  loadBookings();
</script>
</body>
</html>
