<!DOCTYPE html>
<html>
<head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="container mt-5" style="max-width:500px">
  <h2>Login</h2>
  <form id="loginForm">
    <div class="mb-3"><label>Email</label><input type="email" id="email" class="form-control" required></div>
    <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary">Login</button>
    <a href="/signup.html" class="ms-3">Create an account</a>
  </form>
  <div id="message" class="mt-3"></div>
</div>
<script src="./config.js"></script>
<script>
  const API_BASE = window._APP_CONFIG_.API_BASE_URL;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/profile.html';
      } else {
        document.getElementById('message').innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
      }
    } catch (err) {
      document.getElementById('message').innerHTML = `<div class="alert alert-danger">Network error</div>`;
    }
  });
</script>
</body>
</html>
